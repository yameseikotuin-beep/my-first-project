<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新しいアプリ</title>
<style>
  :root {
    --bg: #f4f6f5;
    --card: #ffffff;
    --text: #1f2a24;
    --muted: #6b7a72;
    --border: #e1e6e3;
    --primary: #2f9e6e;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(0,0,0,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141816;
      --card: #1d2320;
      --text: #e6ece9;
      --muted: #94a39b;
      --border: #2c3430;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.6;
  }
  header { padding: 16px; text-align: center; }
  header h1 { margin: 0; font-size: 1.4rem; }
  main { max-width: 640px; margin: 0 auto; padding: 0 16px 32px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px;
    margin-bottom: 16px;
  }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>新しいアプリ</h1>
</header>
<main>
  <section class="card">
    <p class="muted">ここにアプリの中身を作っていきます。</p>
  </section>
</main>
<script>
  // データはこのアプリ専用のキーで localStorage に保存する（他のアプリと混ざらないように）
  const STORAGE_KEY = 'new-app:data';

  function loadData() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    } catch (e) {
      return {};
    }
  }

  function saveData(data) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {
      // 保存できない環境（プライベートモード等）では何もしない
    }
  }
</script>
</body>
</html>
